[project]
name = "telco-churn-pipeline"
version = "1.0.0"
description = "End-to-end ML pipeline for Telco Customer Churn prediction"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
